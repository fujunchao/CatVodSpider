name: bench-spider-jar

on:
  workflow_dispatch:
    inputs:
      label:
        description: 'round label'
        required: false
        default: 'round1'

permissions:
  contents: read

jobs:
  windows:
    name: windows-latest
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (JBR)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain
        shell: pwsh
        run: |
          java -version
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"

      - name: Build spider JAR
        shell: pwsh
        run: .\gradlew.bat spiderJar --no-daemon --console=plain

      - name: Report artifact
        if: always()
        shell: pwsh
        run: |
          if (Test-Path jar/custom_spider.jar) {
            (Get-Item jar/custom_spider.jar) | Select-Object Length, Name | Format-Table -AutoSize
            Get-Content jar/custom_spider.jar.md5
          } else { Write-Host 'NO JAR' }

  ubuntu:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (JBR)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Patch Windows-only assumptions for Linux
        run: |
          sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jar/checkJar.ps1')
          s = p.read_text(encoding='utf-8')
          before = s
          s = s.replace('"javax\\xml\\namespace", "org\\slf4j", "org\\xmlpull\\v1"',
                        '"javax/xml/namespace", "org/slf4j", "org/xmlpull/v1"')
          s = s.replace('Join-Path $smali "com\\github\\catvod"',
                        'Join-Path $smali "com/github/catvod"')
          assert s != before, 'patch did not apply'
          p.write_text(s, encoding='utf-8')
          PY
          grep -n 'javax/xml\|com/github/catvod' jar/checkJar.ps1
          readlink -f /usr/local/bin/powershell

      - name: Show toolchain
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"

      - name: Build spider JAR
        run: |
          chmod +x gradlew
          ./gradlew spiderJar --no-daemon --console=plain

      - name: Report artifact
        if: always()
        run: |
          ls -la jar/custom_spider.jar jar/custom_spider.jar.md5 || echo 'NO JAR'
