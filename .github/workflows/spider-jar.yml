name: spider-jar

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  RELEASE_TAG: spider-latest

concurrency:
  group: spider-jar-publish
  cancel-in-progress: false

jobs:
  build:
    name: build-spider-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21 (JBR)
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
          token: ${{ github.token }}

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make checkJar.ps1 work on Linux
        run: |
          sudo ln -sf "$(command -v pwsh)" /usr/local/bin/powershell
          python3 - <<'PY'
          from pathlib import Path
          p = Path('jar/checkJar.ps1')
          s = p.read_text(encoding='utf-8')
          before = s
          s = s.replace('"javax\\xml\\namespace", "org\\slf4j", "org\\xmlpull\\v1"',
                        '"javax/xml/namespace", "org/slf4j", "org/xmlpull/v1"')
          s = s.replace('Join-Path $smali "com\\github\\catvod"',
                        'Join-Path $smali "com/github/catvod"')
          s = s.replace("TrimEnd('\\')", "TrimEnd([char[]]@('/', '\\'))")
          assert s != before, 'patch did not apply'
          p.write_text(s, encoding='utf-8')
          PY
          grep -n 'javax/xml\|com/github/catvod\|TrimEnd' jar/checkJar.ps1

      - name: Build spider JAR
        run: |
          chmod +x gradlew
          ./gradlew spiderJar --no-daemon --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom_spider.jar-${{ github.run_number }}
          path: |
            jar/custom_spider.jar
            jar/custom_spider.jar.md5
          if-no-files-found: error

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          md5="$(tr -d '\r' < jar/custom_spider.jar.md5)"
          size="$(stat -c %s jar/custom_spider.jar)"
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" \
            jar/custom_spider.jar jar/custom_spider.jar.md5 \
            --title "spider-latest" \
            --notes "commit $GITHUB_SHA · run #$GITHUB_RUN_NUMBER · size $size B · md5 $md5"
          echo "published $RELEASE_TAG ($size B, $md5)"
